name: Skyforge · Authorized Sheets Reference Sync and Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/skyforge-reference-sync.yml
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

# The main-branch OIDC reader imports only the registered, explicitly shared sources.
# No spreadsheet IDs, credentials, tokens, or private source rows are committed.
# Native Docs are the executable source; the retired Git kernel is historical recovery only.
permissions:
  contents: read
  id-token: write

concurrency:
  group: jp-scheduling-production-pages
  cancel-in-progress: false

jobs:
  reference-sync-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce authorized main-branch OIDC context
        run: test "$GITHUB_REF_NAME" = "main"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Authenticate existing public-repository Google WIF reader
        id: skyforge-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/247425973072/locations/global/workloadIdentityPools/jp-pages-github/providers/github
          service_account: jp-public-pages-reader@just-a-project-5007.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets.readonly
            https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Read exact reviewed runtime code from native Google Docs
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const token=process.env.GOOGLE_OAUTH_ACCESS_TOKEN;
          if(!token)throw Error('Read-only code source authorization unavailable');
          const out=join(process.env.RUNNER_TEMP,'skyforge-native-code');mkdirSync(out,{recursive:true});
          const sources=[
            ['Skyforge V1.20 — Native Kernel Hydration and QA Overlay — Source Code V000001','runtime/hydrate-kernel.mjs','85cf2e5bc4c39e4e72c3f3780be44eb9ee686efa','hydrate-kernel.mjs'],
            ['Skyforge V1.20 — Native Kernel Hydration and QA Overlay — Source Code V000001','scripts/qa-primavera-browser.mjs','850aee58a54d584666873d29efde32df2362a433','qa-primavera-browser.mjs'],
            ['Skyforge V1.19 — publisher_01 — Source Code LIVE V000001','publisher/.github/source-gallery/install.py','a06d063357fb18f3f5c025da3eb95f408e5bd7b6','install.py'],
            ['Skyforge V1.19 — publisher_01 — Source Code LIVE V000001','publisher/.github/source-gallery/source-gallery.js','20a2eb82460fa408af70253e3f8efe7dfbd38fe0','source-gallery.js'],
            ['Skyforge V1.20 — Calendar and Static Publication — Source Code V000001','.github/source-gallery/static_publish.py','10f0b651b4efc38b29bb00ec1fdd1bf3f3973782','static_publish.py'],
            ['Skyforge V1.20 — Publisher Workflow and Static Browser QA — Source Code V000001','.github/source-gallery/static-qa.cjs','a289e4dbb152fc6c3bf4f20b4454ef3b2a48221a','static-qa.cjs'],
            ['Skyforge V1.21 — Module B1 Baseline and Progress Control — Source Code V000001','runtime/progress_control.py','0bdf257e90884db303b28be4c85125d271899aa2','progress_control.py'],
            ['Skyforge V1.22 — Module B2a Remaining-work Forecast — Source Code V000001','runtime/forecast_control.py','5be8fc485265d570001825f5f2f5f2a5fc5a41eb','forecast_control.py'],
            ['Skyforge V1.23 — Module B2b Physical Progress and S-curves — Source Code V000001','runtime/physical_progress.py','523b04acd5f50b8fc47438df39aa237ea60d73ee','physical_progress.py'],
            ['Skyforge V1.23 — Module B2b Physical Progress and S-curves — Source Code V000001','runtime/physical_progress_publish.py','69dfafb4936806c7dda05388060c9d5c937cc93e','physical_progress_publish.py'],
            ['Skyforge V1.24 — Module B2c Baseline Actual Forecast Gantt — Source Code V000001','runtime/gantt_overlay.py','35f288e7cb87257398bec6af5f6a6b228e0c5d87','gantt_overlay.py']
          ];
          for(const [title,sourcePath,sha,name] of sources){
            const q=new URLSearchParams({q:"name = '"+title+"' and mimeType = 'application/vnd.google-apps.document' and trashed = false",fields:'nextPageToken,files(id,name)',pageSize:'100'});
            const h={Authorization:'Bearer '+token};
            const r=await fetch('https://www.googleapis.com/drive/v3/files?'+q,{headers:h,signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error('Native code source lookup failed HTTP '+r.status);
            const j=await r.json();if(j.files?.length!==1||j.nextPageToken)throw Error('Expected one reviewed native code source: '+name);
            const id=j.files[0].id;console.log('::add-mask::'+id);
            const x=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'/export?mimeType=text%2Fplain',{headers:h,signal:AbortSignal.timeout(60000)});
            if(!x.ok)throw Error('Native code export failed HTTP '+x.status);
            const lines=(await x.text()).replace(/\r\n/g,'\n').split('\n');
            const a=lines.indexOf('BEGIN SOURCE '+sourcePath),b=lines.indexOf('END SOURCE '+sourcePath);
            if(a<0||b<=a)throw Error('Invalid native source block '+name);
            let first=a+1;while(first<b&&!lines[first].startsWith('|'))first++;if(lines.slice(first,b).some(v=>!v.startsWith('|')))throw Error('Invalid native source line '+name);
            const code=lines.slice(first,b).map(v=>v.slice(1)).join('\n');
            const actual=createHash('sha1').update('blob '+Buffer.byteLength(code)+'\0').update(code).digest('hex');
            if(actual!==sha)throw Error('Native code changed: AI review and checksum registration required for '+name);
            writeFileSync(join(out,name),code);
          }
          console.log('SKYFORGE_NATIVE_CODE_READBACK_PASS 11 exact reviewed source files');
          NODE
      - name: Reconstruct complete reviewed kernel from native Google Docs
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          node "$RUNNER_TEMP/skyforge-native-code/hydrate-kernel.mjs" "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/skyforge-native-code/qa-primavera-browser.mjs" scripts/qa-primavera-browser.mjs
      - name: Validate canonical Skyforge kernel
        run: |
          npm test
          npm run verify:calendar
          npm run machine:build
          npm run machine:verify
          npm run wbs:build
          npm run wbs:verify
          npm run pilot:build
          npm run pilot:verify
          npm run progress:build
          npm run progress:verify
          npm run visual:build
          npm run visual:verify
          npm run generic:build
          npm run generic:verify
          npm run site:build
      - name: Discover exactly the two authorized reference workbooks privately
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.GOOGLE_OAUTH_ACCESS_TOKEN;
          if(!token)throw Error('Google read-only access token unavailable');
          const books=[
            ['SKYFORGE_WORK_RATES_SHEET_ID','Skyforge — Work Output Rates — LIVE — V000001'],
            ['SKYFORGE_MATERIALS_SHEET_ID','Skyforge — Material Consumption Norms — LIVE — V000001']
          ];
          for(const [variable,title] of books){
            const query=new URLSearchParams({
              q:"name = '"+title+"' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false",
              fields:"nextPageToken,files(id,name,mimeType)",
              pageSize:"100"
            });
            const response=await fetch('https://www.googleapis.com/drive/v3/files?'+query,
              {headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('Read-only Drive metadata lookup failed (HTTP '+response.status+')');
            const payload=await response.json();
            const matches=(payload.files||[]).filter(f=>f.name===title);
            if(matches.length!==1||payload.nextPageToken)throw Error('Expected exactly one authorized reference workbook: '+variable);
            if(!/^[A-Za-z0-9_-]{20,100}$/.test(matches[0].id))throw Error('Invalid source identifier: '+variable);
            console.log('::add-mask::'+matches[0].id);
            appendFileSync(process.env.GITHUB_ENV,variable+'='+matches[0].id+'\n');
          }
          console.log('Two explicitly shared reference workbook identities validated');
          NODE
      - name: Import and validate private Sheets into public-safe normalized snapshots
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: node scripts/sync-reference-norms.mjs --pull-sheets
      - name: Independently verify synchronized output and privacy
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const r=p=>JSON.parse(readFileSync('dist/work-items/'+p,'utf8'));
          const status=r('norms-source-status.json');
          const base=r('productivity-norms.v1.json'),rates=r('productivity-starters.v2.json'),materials=r('material-references.v1.json');
          const items=[
            ['productivity-norms.v1.json',base],
            ['productivity-starters.v2.json',rates],
            ['material-references.v1.json',materials]
          ];
          if(status.status!=='GOOGLE_SHEETS_V000001_IMPORTED'||!status.sync_completed)throw Error('No authenticated Sheet publication status');
          if(base.items.length!==88||rates.profiles.length!==46||materials.recipes.length!==36||
             materials.recipes.flatMap(x=>x.lines).length!==65)throw Error('Invalid imported register dimensions');
          for(const [name,data] of items){
            const expected=createHash('sha256').update(JSON.stringify(data)).digest('hex');
            if(expected!==status.source_content_hashes[name])throw Error('Published hash mismatch: '+name);
          }
          for(const name of ['norms-source-status.json','productivity-norms.v1.json',
                             'productivity-starters.v2.json','material-references.v1.json']){
            const text=readFileSync('dist/work-items/'+name,'utf8');
            if(/docs\.google\.com\/spreadsheets\/d\/|drive\.google\.com\/file\/d\/|access_token=|ya29\./i.test(text))
              throw Error('Private source address or token found in public dataset: '+name);
          }
          console.log('Validated source status, 88/46/36/65 record counts, hashes, and public-data boundaries');
          NODE
      - name: Read the registered project Sheets and native Doc exports
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: node scripts/import-primavera-docsheet-v2.mjs
      - name: Build and browser-test the complete shared schedule workspace
        run: |
          node scripts/build-site-docsheet-v2.mjs
          node scripts/verify-primavera-docsheet-v2.mjs
          npm install --prefix "$RUNNER_TEMP/primavera-browser" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/primavera-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/primavera-browser/node_modules" node scripts/qa-primavera-browser.mjs
      - name: Validate and include the shared project schedule workspace
        run: |
          test ! -e dist/schedules
          mv dist-v2 dist/schedules
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const links=[
            ['dist/index.html','<section class="hero">','./schedules/projects/'],
            ['dist/projects/index.html','<main','../schedules/projects/']
          ];
          for(const [path,marker,href] of links){
            const page=await readFile(path,'utf8');
            const start=page.indexOf(marker);
            if(start<0)throw Error('Missing schedule entry point in '+path);
            const end=page.indexOf('>',start)+1;
            const link='<p><a href="'+href+'">Open live project schedules</a></p>';
            await writeFile(path,page.slice(0,end)+link+page.slice(end));
          }
          NODE
      - name: Install the Google-Doc-authored source gallery
        run: |
          mkdir -p gallery-release/.github/source-gallery
          cp "$RUNNER_TEMP/skyforge-native-code/install.py" "$RUNNER_TEMP/skyforge-native-code/source-gallery.js" gallery-release/.github/source-gallery/
          python3 gallery-release/.github/source-gallery/install.py dist jp-scheduling-resources-management
      - name: Verify Foreman and source directory in the final combined Pages artifact
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir,stat,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          import assert from 'node:assert/strict';
          let live=0,redirects=0;
          async function walk(dir){
            for(const e of await readdir(dir,{withFileTypes:true})){
              const file=join(dir,e.name);
              if(e.isDirectory()){await walk(file);continue;}
              if(!file.endsWith('.html'))continue;
              const html=await readFile(file,'utf8');
              if(/<meta\b[^>]*http-equiv\s*=\s*["']?refresh\b/i.test(html)){redirects++;continue;}
              assert.equal((html.match(/data-skyforge-foreman\b/g)||[]).length,1,file);
              live++;
            }
          }
          await walk('dist');
          assert.equal(live,80);assert.equal(redirects,15);
          await stat('dist/schedules/resources/sources.html');
          await stat('dist/schedules/projects/control.html');
          for(const project of ['PORT-000001','PORT-000014']){const x=JSON.parse(await readFile('dist/schedules/data/projects/'+project+'.json','utf8'));assert.equal(x.planning_control.approved_critical_path,false);assert.ok(x.planning_settings);}
          assert.equal(await readFile('dist/assets/skyforge-foreman.mjs','utf8'),await readFile('dist/schedules/assets/skyforge-foreman.mjs','utf8'));
          const raw=await readFile('dist/schedules/data/source-register.json','utf8');
          assert.ok(!/docs\.google\.com\/|drive\.google\.com\/|@|access_token|ya29\.|PRIVATE KEY/i.test(raw));
          const r=JSON.parse(raw);
          assert.equal(r.inputs.length,48);
          assert.equal(r.inputs.filter(x=>x.kind==='Doc').length,22);
          assert.equal(r.inputs.filter(x=>x.kind==='Sheet').length,26);
          const sourcePage=await readFile('dist/schedules/resources/sources.html','utf8');
          const gallery=await readFile('gallery-release/.github/source-gallery/source-gallery.js','utf8');
          for(const target of ['https://drive.google.com/drive/folders/1HGw_OKAQobPCv2JW0j23eUqjBwlsJdpt','https://docs.google.com/spreadsheets/d/1ONVr7nEC4noswyH9bBuXI9GEVW5r6RcaDyo-Z3z2uy4/edit#gid=102','https://docs.google.com/spreadsheets/d/1ONVr7nEC4noswyH9bBuXI9GEVW5r6RcaDyo-Z3z2uy4/edit#gid=103']){
            assert.ok(sourcePage.includes(target)&&gallery.includes(target),'Missing approved navigation entry point');
          }
          const mascot=await readFile('dist/schedules/assets/skyforge-foreman.mjs','utf8');
          assert.ok(mascot.includes('getPointAtLength')&&mascot.includes('calendarRoute')&&mascot.includes('pointer-events:none'),'Roaming Foreman missing');
          assert.ok((await readFile('dist/schedules/assets/app.js','utf8')).includes('calendar-count'),'Compact calendar count missing');
          const planner=await readFile('dist/schedules/assets/app.js','utf8');
          assert.ok(planner.includes('ganttScale')&&planner.includes('Work-stage overview')&&planner.includes('Selected relationships'),'Planner Gantt controls missing');
          assert.ok(mascot.includes('settleTimer')&&mascot.includes('lastSegment'),'Foreman stability correction missing');
          const manifest={kernel_commit:'03a415b3b0f3f784c07c05b867556971fc42b360',kernel_source:'GOOGLE_DOCS_EXACT_SNAPSHOT',kernel_snapshot_sha256:'9e3ff1cb0ac05b3aaa7ba7cf5197902795f42984cc4c6c8ccb454abbf509eb25',publisher_commit:process.env.GITHUB_SHA,workflow_run:process.env.GITHUB_RUN_ID,generated_at:new Date().toISOString(),interactive_pages:live,redirects,live_sources:r.inputs.length};
          await writeFile('dist/schedules/release.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('SKYFORGE_RELEASE_MANIFEST',JSON.stringify(manifest));
          console.log('SKYFORGE_FOREMAN_RELEASE_PASS',JSON.stringify({interactive_pages:live,redirects,live_sources:r.inputs.length}));
          NODE
      - name: Compute mixed-calendar programme and isolate legacy browser engines
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          python3 "$RUNNER_TEMP/skyforge-native-code/static_publish.py" dist --audit build/private/v120-calendar-static.json
      - name: Calculate source-backed baseline and progress projection
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          python3 "$RUNNER_TEMP/skyforge-native-code/progress_control.py" --self-test
          python3 "$RUNNER_TEMP/skyforge-native-code/progress_control.py" dist --audit build/private/v121-progress-control.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('dist/schedules/data/project-index.json','utf8'));
          for(const p of index.projects){
            const m=JSON.parse(readFileSync('dist/schedules/data/projects/'+p.id+'.json','utf8'));
            assert.ok(m.progress_control);for(const k of ['baseline','actuals','remaining'])assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(m.progress_control[k].state));
            assert.ok(!('intake_counts' in m.planning_settings));
            if(m.progress_control.actuals.state==='NOT_AVAILABLE')assert.equal(m.planning_settings.data_date,'');
            if(m.progress_control.completion_curve){assert.equal(m.progress_control.completion_curve.basis,'COMPLETED_TASK_COUNT');assert.ok(m.progress_control.completion_curve.points.every(x=>x.date<=m.progress_control.completion_curve.data_date||x.actual===null));}
          }
          assert.equal(JSON.parse(readFileSync('dist/schedules/release.json','utf8')).progress_control,'B1_NATIVE_PRECOMPUTED');
          console.log('MODULE_B_PUBLIC_CONTRACT_PASS '+index.projects.length);
          NODE
      - name: Calculate accepted calendar-aware remaining-work forecast
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          python3 "$RUNNER_TEMP/skyforge-native-code/forecast_control.py" --self-test
          python3 "$RUNNER_TEMP/skyforge-native-code/forecast_control.py" dist --audit build/private/v122-forecast-control.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('dist/schedules/data/project-index.json','utf8'));
          for(const p of index.projects){
            const m=JSON.parse(readFileSync('dist/schedules/data/projects/'+p.id+'.json','utf8'));
            const f=m.forecast_control;
            assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(f.state));
            if(f.state==='NOT_AVAILABLE')assert.deepEqual(Object.keys(f),['state']);
            else{assert.equal(f.activities.length,m.activities.length);assert.ok(f.activities.every(a=>!a.remaining_start||a.remaining_start>=f.data_date));}
          }
          assert.equal(JSON.parse(readFileSync('dist/schedules/release.json','utf8')).forecast_control,'B2A_NATIVE_PRECOMPUTED');
          console.log('SKYFORGE_B2A_PUBLIC_CONTRACT_PASS '+index.projects.length);
          NODE
      - name: Calculate accepted measured physical progress and static S-curves
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          python3 "$RUNNER_TEMP/skyforge-native-code/physical_progress_publish.py" --self-test
          python3 "$RUNNER_TEMP/skyforge-native-code/physical_progress_publish.py" dist --audit build/private/v123-physical-progress.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('dist/schedules/data/project-index.json','utf8'));
          let available=0;
          for(const p of index.projects){
            const m=JSON.parse(readFileSync('dist/schedules/data/projects/'+p.id+'.json','utf8'));
            const x=m.physical_progress;
            assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(x.state));
            if(x.state==='NOT_AVAILABLE')assert.deepEqual(Object.keys(x),['state']);
            else{
              available++;assert.equal(x.basis,'APPROVED_QUANTITY_WEIGHT_POINTS');
              assert.ok(x.points.length&&x.points.every(t=>t.planned>=0&&t.planned<=100&&(t.actual===null||(t.date<=x.data_date&&t.actual>=0&&t.actual<=100))));
              assert.ok(x.points.every((t,i)=>!i||t.planned>=x.points[i-1].planned));
              assert.equal(x.points.find(t=>t.date===x.data_date).actual,x.actual_at_data_date);
              assert.ok(x.planned_path.length&&x.actual_path.length);
              assert.ok(!/evidence|sha256:|Measurement ID|weight points.*fixture/i.test(JSON.stringify(x)));
            }
          }
          assert.equal(JSON.parse(readFileSync('dist/schedules/release.json','utf8')).physical_progress,'B2B_NATIVE_PRECOMPUTED');
          assert.ok(readFileSync('dist/schedules/assets/app.js','utf8').includes('Measured physical progress'));
          console.log('SKYFORGE_B2B_PUBLIC_CONTRACT_PASS '+index.projects.length+' models; '+available+' available');
          NODE
      - name: Calculate accepted baseline actual forecast Gantt overlay
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.skyforge-auth.outputs.access_token }}
        run: |
          python3 "$RUNNER_TEMP/skyforge-native-code/gantt_overlay.py" --self-test
          python3 "$RUNNER_TEMP/skyforge-native-code/gantt_overlay.py" dist --audit build/private/v124-gantt-overlay.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('dist/schedules/data/project-index.json','utf8'));
          let available=0;
          for(const p of index.projects){
            const m=JSON.parse(readFileSync('dist/schedules/data/projects/'+p.id+'.json','utf8'));
            const x=m.gantt_overlay;
            assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(x.state));
            if(x.state==='NOT_AVAILABLE')assert.deepEqual(Object.keys(x),['state']);
            else{
              available++;assert.equal(x.activities.length,m.activities.length);
              assert.equal(x.baseline_available,m.progress_control.baseline.state==='AVAILABLE');
              assert.equal(x.actual_available,m.progress_control.actuals.state==='AVAILABLE');
              assert.equal(x.forecast_available,m.forecast_control.state==='AVAILABLE');
              for(const a of x.activities){for(const k of ['baseline','actual','forecast']){const s=a[k];if(s){assert.ok(s.start<=s.finish&&s.left>=0&&s.width>=0&&s.left+s.width<=100.00001);}}if(a.actual?.open)assert.equal(a.actual.finish,x.data_date);if(a.forecast)assert.ok(a.forecast.start>=x.data_date);}
            }
          }
          assert.equal(JSON.parse(readFileSync('dist/schedules/release.json','utf8')).gantt_overlay,'B2C_NATIVE_PRECOMPUTED');
          assert.ok(readFileSync('dist/schedules/assets/app.js','utf8').includes('ganttOverlayView();'));
          console.log('SKYFORGE_B2C_PUBLIC_CONTRACT_PASS '+index.projects.length+' models; '+available+' available');
          NODE
      - name: Verify static presentation after legacy isolation
        run: |
          NODE_PATH="$RUNNER_TEMP/primavera-browser/node_modules" node "$RUNNER_TEMP/skyforge-native-code/static-qa.cjs" dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist
  deploy:
    needs: reference-sync-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated Docs- and Sheets-backed Skyforge
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  live-readback:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact published static edition and removed engine payload
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://fabingurung.github.io/jp-scheduling-resources-management/';
          const url=p=>root+p+(p.includes('?')?'&':'?')+'release='+process.env.GITHUB_RUN_ID;
          const get=async p=>fetch(url(p),{cache:'no-store',signal:AbortSignal.timeout(15000)});
          let release=null;
          for(let i=0;i<12;i++){
            try{const r=await get('schedules/release.json');if(r.ok){const j=await r.json();if(j.workflow_run===process.env.GITHUB_RUN_ID){release=j;break;}}}catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          assert.ok(release,'Expected published release not found');assert.equal(release.publisher_commit,process.env.GITHUB_SHA);assert.equal(release.public_engine_files,0);assert.equal(release.interactive_pages,14);assert.equal(release.kernel_source,'GOOGLE_DOCS_EXACT_SNAPSHOT');assert.equal(release.progress_control,'B1_NATIVE_PRECOMPUTED');assert.equal(release.forecast_control,'B2A_NATIVE_PRECOMPUTED');assert.equal(release.physical_progress,'B2B_NATIVE_PRECOMPUTED');assert.equal(release.gantt_overlay,'B2C_NATIVE_PRECOMPUTED');
          for(const p of ['index.html','schedules/','schedules/projects/index.html','schedules/projects/gantt.html?project=PORT-000001','schedules/projects/calendar.html?project=PORT-000001','schedules/projects/control.html?project=PORT-000001','schedules/resources/index.html','schedules/resources/modules.html','schedules/resources/sources.html','planner.html'])assert.equal((await get(p)).status,200,p);
          const m=await (await get('schedules/data/projects/PORT-000001.json')).json();
          assert.equal(m.planning_control.scenario.state,'RELATIVE_CALENDAR');assert.equal(m.planning_control.scenario.finish,524);assert.equal(m.planning_control.scenario.zero_float_count,91);assert.equal(m.planning_control.scenario.activities.length,156);
          assert.ok(!('relative_span_mismatches' in m.planning_control));assert.ok(m.progress_control);assert.ok(m.forecast_control);assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(m.physical_progress.state));assert.ok(['AVAILABLE','NOT_AVAILABLE'].includes(m.gantt_overlay.state));assert.ok((await (await get('schedules/assets/app.js')).text()).includes('ganttOverlayView();'));assert.ok((await (await get('schedules/assets/app.js')).text()).includes('Measured physical progress'));assert.ok(!('intake_counts' in m.planning_settings));assert.ok(m.public_narrative.includes('The construction programme organizes activities, dependencies, work stages and milestones.'));
          assert.equal((await get('src/kernel/cpm.mjs')).status,404);
          assert.doesNotMatch(await (await get('planner.html')).text(),/<script\b/i);
          console.log('SKYFORGE_STATIC_LIVE_READBACK_PASS '+process.env.GITHUB_RUN_ID);
          NODE
