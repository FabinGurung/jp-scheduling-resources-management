name: QA · Skyforge 5-direction navigation live desktop/mobile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-skyforge-compass-live-20261116.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  served-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium browser test
        run: |
          mkdir -p "$RUNNER_TEMP/skyforge-compass-qa"
          cd "$RUNNER_TEMP/skyforge-compass-qa"
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect served Pages and exercise real responsive Gantt interactions
        run: |
          cat > "$RUNNER_TEMP/skyforge-compass-qa/qa.mjs" <<'NODE'
          import {chromium} from "playwright";
          import assert from "node:assert/strict";
          import {mkdir,writeFile} from "node:fs/promises";
          import {join} from "node:path";
          const base="https://fabingurung.github.io/jp-scheduling-resources-management/";
          const out=join(process.env.RUNNER_TEMP,"skyforge-compass-qa","results");
          await mkdir(out,{recursive:true});
          const report={source:"Served live public GitHub Pages in Chromium; no build fixture",checked:new Date().toISOString(),checks:[],images:[]};
          const pass=(name,details)=>report.checks.push({name,details,result:"PASS"});
          const get=async path=>{
            const response=await fetch(base+path+"?revision=20261116-compass",{signal:AbortSignal.timeout(30000),cache:"no-store"});
            assert.equal(response.status,200,path+" should serve HTTP 200");
            return response.text();
          };
          let browser=null,page=null,mobile=null;
          try{
            const [N,H,P]=await Promise.all([
              get("projects/narayani/schedule-v002.json"),
              get("projects/fishtail/harisharan-residence/schedule-v002.json"),
              get("projects/narayani/project-model.json")
            ]);
            const n=JSON.parse(N),h=JSON.parse(H),p=JSON.parse(P);
            assert.deepEqual([n.activities.length,n.links.length,n.holds.length],[160,210,6]);
            assert.deepEqual([h.activities.length,h.links.length],[839,1321]);
            assert.equal(n.baseline_approved,false);
            assert.equal(h.baseline_approved,false);
            assert.equal(h.planner_integration.m25_recipe_applied,false);
            assert.equal(p.activities.length,45);
            pass("Source-safe schedules","Narayani 160/210/6; Harisharan 839/1321; pilot 45; all unapproved");
            browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
            page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errs=[];
            page.on("pageerror",e=>errs.push(e.message));
            await page.goto(base+"projects/narayani/schedule-v002.html#activities",
              {waitUntil:"domcontentloaded",timeout:45000});
            await page.locator(".desk-compass-east .desk-compass-selected h2").waitFor({timeout:30000});
            assert.equal(await page.locator(".desk-compass-grid").count(),1);
            for(const tag of ["west","centre","east"])
              assert.equal(await page.locator(".desk-compass-"+tag).count(),1);
            assert.equal(await page.locator(".desk-compass-south").count(),1);
            const nav=await page.locator(".sf-global .sf-menu").innerText();
            for(const label of ["Home","Projects","Studio","Reference"])
              assert.ok(nav.includes(label));
            assert.ok(!nav.includes("Overview"),"Old Overview must not duplicate Home");
            await page.screenshot({path:join(out,"narayani-desktop-overview.png")});
            report.images.push("narayani-desktop-overview.png");
            pass("North and desk layout","Four nonduplicate primary destinations plus W/C/E/S regions");
            const wbs=page.locator(".desk-compass-wbs-button");
            assert.ok(await wbs.count()>0,"Populated WBS branches are clickable");
            await wbs.first().click();
            assert.equal(await wbs.first().getAttribute("aria-pressed"),"true");
            assert.ok(await page.locator(".desk-table tbody tr").count()>0);
            assert.match(await page.locator(".desk-compass-selected h2").innerText(),/ · /);
            await page.locator(".desk-compass-all").click();
            assert.ok(await page.locator(".desk-table tbody tr").count()>0);
            const find=page.locator(".desk-compass-search");
            await find.fill(n.activities[0].id);
            assert.ok(await page.locator(".desk-compass-wbs-button").count()>0);
            await find.fill("");
            pass("West source navigation","Search WBS and activities, select branch, filter Gantt and restore all");
            await page.locator(".desk-compass-actions button",{hasText:"Resources"}).click();
            assert.equal(await page.locator('.desk-detail-tab[data-detail="Resources"]').getAttribute("aria-selected"),"true");
            await page.locator(".desk-compass-actions button",{hasText:"Predecessors"}).click();
            assert.equal(await page.locator('.desk-detail-tab[data-detail="Predecessors"]').getAttribute("aria-selected"),"true");
            const contextLinks=page.locator(".desk-compass-relations button");
            if(await contextLinks.count()){
              const before=await page.locator(".desk-compass-selected h2").innerText();
              await contextLinks.first().click();
              const after=await page.locator(".desk-compass-selected h2").innerText();
              assert.notEqual(after,before,"Relation button must select corresponding source activity");
            }
            assert.ok((await page.locator(".desk-compass-sources").innerText()).includes("Approved baseline: NO"));
            pass("East actionable detail","Resource and predecessor tabs open, relation buttons change selection, approvals unverified");
            const south=page.locator(".desk-compass-south");
            assert.ok(await south.locator('a[href*="work-items/materials.html"]').count());
            assert.ok(await south.locator('a[href*="commits/kernel-v0.2-open-source-engines"]').count());
            assert.ok(await south.locator('a[href*="releases/tag/"]').count());
            const next=south.locator(".desk-compass-trail button").last();
            if(await next.isEnabled()){
              const old=await page.locator(".desk-compass-selected h2").innerText();
              await next.click();
              assert.notEqual(await page.locator(".desk-compass-selected h2").innerText(),old);
            }
            pass("South real navigation","Previous/next selection, project links, history, templates, rates and materials");
            await page.locator('.desk-compass-toc button[data-compass-view="calendar"]').click();
            assert.equal(await page.getByRole("tab",{name:"Relative week calendar"}).getAttribute("aria-selected"),"true");
            await page.locator('.desk-compass-toc button[data-compass-view="activities"]').click();
            assert.equal(await page.getByRole("tab",{name:"Activities + Gantt"}).getAttribute("aria-selected"),"true");
            await page.screenshot({path:join(out,"narayani-desktop-compass.png")});
            report.images.push("narayani-desktop-compass.png");
            pass("Synchronized Gantt/calendar","Compass switches both views without editing source data");
            const selector=page.locator(".desk-schedule-edition select");
            assert.equal(await selector.inputValue(),"v002");
            await selector.selectOption("pilot");
            await page.waitForURL(/\/desk\.html/);
            await page.locator(".desk-compass-selected h2").waitFor();
            assert.equal(await page.locator(".desk-schedule-edition select").inputValue(),"pilot");
            assert.match(await page.locator(".desk-source").first().innerText(),/45 activities/);
            await page.locator(".desk-schedule-edition select").selectOption("v002");
            await page.waitForURL(/schedule-v002\.html/);
            await page.locator(".desk-compass-selected h2").waitFor();
            assert.equal(await page.locator(".desk-schedule-edition select").inputValue(),"v002");
            assert.deepEqual(errs,[],"No uncaught desktop JS errors");
            pass("Historic Narayani version selector","Pilot defaults to 45 and v002 remains separate and switchable");
            await page.goto(base+"projects/fishtail/harisharan-residence/schedule-v002.html",
              {waitUntil:"domcontentloaded",timeout:45000});
            await page.locator(".desk-compass-selected h2").waitFor({timeout:30000});
            assert.match(await page.locator(".desk-source").first().innerText(),/839 activities/);
            assert.ok(await page.locator(".desk-compass-wbs-button").count()>0);
            await page.screenshot({path:join(out,"harisharan-desktop-compass.png")});
            report.images.push("harisharan-desktop-compass.png");
            pass("Cross-project renderer","Harisharan shares the same compass with distinct 839-activity source");
            mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const mobileErrors=[];
            mobile.on("pageerror",e=>mobileErrors.push(e.message));
            await mobile.goto(base+"projects/narayani/schedule-v002.html#activities",
              {waitUntil:"domcontentloaded",timeout:45000});
            await mobile.locator(".desk-compass-selected h2").waitFor({timeout:30000});
            for(const region of [".desk-compass-west",".desk-compass-centre",".desk-compass-east",".desk-compass-south"]){
              const rect=await mobile.locator(region).boundingBox();
              assert.ok(rect&&rect.width>=300,region+" must remain a usable mobile section");
            }
            assert.ok(await mobile.locator(".desk-compass-search").isVisible());
            await mobile.locator('.desk-compass-toc button[data-compass-view="calendar"]').click();
            assert.equal(await mobile.getByRole("tab",{name:"Relative week calendar"}).getAttribute("aria-selected"),"true");
            await mobile.screenshot({path:join(out,"narayani-mobile-calendar.png"),fullPage:true});
            report.images.push("narayani-mobile-calendar.png");
            await mobile.locator('.desk-compass-toc button[data-compass-view="activities"]').click();
            await mobile.screenshot({path:join(out,"narayani-mobile-gantt.png"),fullPage:true});
            report.images.push("narayani-mobile-gantt.png");
            assert.deepEqual(mobileErrors,[],"No uncaught mobile JS errors");
            pass("Mobile responsive","390px viewport, usable W/C/E/S panes, touch calendar switching and no JS errors");
            await mobile.goto(base+"projects/fishtail/harisharan-residence/schedule-v002.html",
              {waitUntil:"domcontentloaded",timeout:45000});
            await mobile.locator(".desk-compass-selected h2").waitFor({timeout:30000});
            assert.match(await mobile.locator(".desk-source").first().innerText(),/839 activities/);
            assert.ok(await mobile.locator(".desk-compass-west").isVisible());
            assert.ok(await mobile.locator(".desk-compass-east").isVisible());
            await mobile.locator('.desk-compass-toc button[data-compass-view="calendar"]').click();
            assert.equal(await mobile.getByRole("tab",{name:"Year calendar"}).getAttribute("aria-selected"),"true");
            await mobile.screenshot({path:join(out,"harisharan-mobile-calendar.png"),fullPage:true});
            report.images.push("harisharan-mobile-calendar.png");
            assert.deepEqual(mobileErrors,[],"No uncaught mobile errors across projects");
            pass("Harisharan mobile","839-activity dated scenario uses same compass and year calendar at 390px");
          }catch(error){
            report.failure=String(error.stack||error);
            for(const [p,name] of [[page,"desktop-failure.png"],[mobile,"mobile-failure.png"]]){
              try{if(p)await p.screenshot({path:join(out,name),fullPage:true});}catch{}
            }
            throw error;
          }finally{
            await writeFile(join(out,"report.json"),JSON.stringify(report,null,2));
            if(browser)await browser.close();
          }
          console.log("SKYFORGE LIVE COMPASS QA PASS",JSON.stringify(report));
          NODE
          cd "$RUNNER_TEMP/skyforge-compass-qa"
          node qa.mjs
      - name: Upload desktop/mobile evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-compass-live-qa-20261116
          path: ${{ runner.temp }}/skyforge-compass-qa/results
          retention-days: 30
          if-no-files-found: warn
