name: QA · Primavera v2 One Template + 22 Live Docs Sheets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-primavera-docsheet-v2-staging.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  validate-source-separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: renovation-docsheet-v2-20261121
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source engine and generate prior public-safe reference data
        run: |
          node --check public-v2/assets/app.js
          node --check scripts/import-primavera-docsheet-v2.mjs
          node --check scripts/build-site-docsheet-v2.mjs
          node --check scripts/verify-primavera-docsheet-v2.mjs
          npm test
          npm run verify:calendar
          npm run machine:build
          npm run wbs:build
          npm run pilot:build
          npm run progress:build
          npm run visual:build
          npm run generic:build
          npm run site:build
      - name: Authenticate restricted Google reader with Doc and Sheet read-only scopes
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/247425973072/locations/global/workloadIdentityPools/jp-pages-github/providers/github
          service_account: jp-public-pages-reader@just-a-project-5007.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets.readonly
            https://www.googleapis.com/auth/documents.readonly
            https://www.googleapis.com/auth/drive.metadata.readonly
          create_credentials_file: false
      - name: Re-import the two original authorized reference Sheets
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          for(const [key,name] of [
            ["SKYFORGE_WORK_RATES_SHEET_ID","Skyforge — Work Output Rates — LIVE — V000001"],
            ["SKYFORGE_MATERIALS_SHEET_ID","Skyforge — Material Consumption Norms — LIVE — V000001"]
          ]){
            const q=new URLSearchParams({q:"name = '"+name+"' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false",fields:"nextPageToken,files(id,name)",pageSize:"100"});
            const response=await fetch("https://www.googleapis.com/drive/v3/files?"+q,{
              headers:{Authorization:"Bearer "+process.env.GOOGLE_OAUTH_ACCESS_TOKEN},signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error("Could not read original reference register metadata");
            const d=await response.json();
            if(d.nextPageToken||d.files?.length!==1||d.files[0].name!==name)throw Error("Ambiguous original source reference identity");
            appendFileSync(process.env.GITHUB_ENV,key+"="+d.files[0].id+"\n");
          }
          NODE
          node scripts/sync-reference-norms.mjs --pull-sheets
      - name: Fetch all live per-project Docs and Sheets and build privacy-reduced project data
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node scripts/import-primavera-docsheet-v2.mjs
      - name: Build one shared home, projects, resources and project viewer and validate
        run: |
          node scripts/build-site-docsheet-v2.mjs
          node scripts/verify-primavera-docsheet-v2.mjs
      - name: Preserve the verified preview artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-v2-docsheet-private-source-validated-public-site
          path: dist-v2
          if-no-files-found: error
          retention-days: 30
