name: QA · Skyforge four-view package CAD calendar east live
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-skyforge-four-view-live-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/skyforge-four-view-qa"
          cd "$RUNNER_TEMP/skyforge-four-view-qa"
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Assert served Pages, four views, source counts and responsive East
        run: |
          cat > "$RUNNER_TEMP/skyforge-four-view-qa/qa.mjs" <<'NODE'
          import {chromium} from "playwright";
          import assert from "node:assert/strict";
          import {mkdir,writeFile} from "node:fs/promises";
          import {join} from "node:path";
          const root="https://fabingurung.github.io/jp-scheduling-resources-management/";
          const evidence=join(process.env.RUNNER_TEMP,"skyforge-four-view-qa","results");
          await mkdir(evidence,{recursive:true});
          const report={basis:"served public GitHub Pages, not repo fixture",time:new Date().toISOString(),checks:[],screenshots:[]};
          const pass=(name,detail)=>report.checks.push({name,detail,pass:true});
          let browser=null,page=null;
          try{
           const get=async path=>{
            const r=await fetch(root+path+"?qa=20261117-4views",{signal:AbortSignal.timeout(30000),cache:"no-store"});
            assert.equal(r.status,200,path+" must serve HTTP 200");return r;
           };
           const [nar,har,draw]=await Promise.all([
             get("projects/narayani/schedule-v002.json"),get("projects/fishtail/harisharan-residence/schedule-v002.json"),
             get("work-items/scheduling-drawing-references.v1.json")
           ]);
           const n=await nar.json(),h=await har.json(),index=await draw.json();
           assert.deepEqual([n.activities.length,n.links.length,n.holds.length,n.activities.filter(x=>x.start_date).length],[160,210,6,156]);
           assert.deepEqual([h.activities.length,h.links.length],[839,1321]);
           assert.equal(index.format,"SKYFORGE_CAD_DRAWING_REFERENCES_V1");
           assert.deepEqual(index.project_links.map(p=>p.project_id),["PRJ-000007","PORT-000014"]);
           assert.ok(index.project_links.every(x=>x.activity_links.length===0));
           assert.equal(n.baseline_approved,false);assert.equal(h.baseline_approved,false);
           pass("Public model integrity","Narayani 160/210/6/156, Harisharan 839/1321 and no CAD/engineering approval");
           browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
           page=await browser.newPage({viewport:{width:1450,height:900}});
           const errors=[];page.on("pageerror",e=>errors.push(e.message));
           await page.goto(root+"projects/fishtail/narayani-parajuli-residence/",{waitUntil:"domcontentloaded"});
           await page.getByText("Scheduling desk · one shared set of source activities").waitFor({timeout:30000});
           assert.equal(await page.locator('a:has-text("v002 Block B planning preview")').count(),0);
           assert.equal(await page.locator('a:has-text("Open the scheduling desk")').count(),1);
           pass("Narayani landing page","One schedule entry only; v002 remains inside version dropdown");
           async function desk(path){
             await page.goto(root+path,{waitUntil:"domcontentloaded",timeout:45000});
             await page.locator(".desk-compass-selected h2").waitFor({timeout:30000});
             for(const x of ["activities","calendar","packages","drawings"])
              assert.equal(await page.locator('.desk-modes button').filter({hasText:x==="activities"?"Activities + Gantt":x==="calendar"?(path.includes("v002.html")&&!path.includes("harisharan")?"Relative week calendar":"Year calendar"):x==="packages"?"Work packages":"Working drawings"}).count(),1);
             assert.equal(await page.locator(".desk-east-details").count(),1);
           }
           await desk("projects/narayani/desk.html#activities");
           assert.equal(await page.locator(".desk-schedule-edition select").inputValue(),"pilot");
           assert.match(await page.locator("header.desk-hero .desk-source").innerText(),/45 activities/);
           await page.locator(".desk-schedule-edition select").selectOption("v002");
           await page.waitForURL(/schedule-v002\.html/,{timeout:30000});
           await page.locator(".desk-compass-selected h2").waitFor();
           assert.equal(await page.locator(".desk-schedule-edition select").inputValue(),"v002");
           pass("Internal version dropdown","45-activity pilot is default and switches to separate v002");
           await page.locator('[data-compass-view="calendar"]').click();
           await page.locator(".desk-relative-day-focus").first().click();
           assert.match(await page.locator(".desk-compass-selected h2").innerText(),/Calendar date/);
           assert.equal(await page.locator('.desk-modes button[aria-selected="true"]').innerText(),"Relative week calendar");
           const activityInWeek=page.locator('.desk-relative-day button:not(.desk-relative-day-focus)').first();
           await activityInWeek.click();
           assert.ok(await page.locator(".desk-east-details").isVisible());
           assert.equal(await page.locator('.desk-modes button[aria-selected="true"]').innerText(),"Relative week calendar");
           pass("Calendar-to-East selection","Day and activity clicks update east inspector without moving back to Gantt");
           await page.locator('[data-compass-view="packages"]').click();
           const from=page.locator(".desk-package-form input").first();
           const to=page.locator(".desk-package-form input").last();
           await from.fill("4");await to.fill("15");
           await page.locator(".desk-package-apply").click();
           assert.equal(await page.locator(".desk-package-item").count(),12);
           assert.match(await page.locator(".desk-compass-selected h2").innerText(),/Package/);
           assert.ok(page.url().includes("pkg=4-15"));
           await page.locator(".desk-package-item").first().click();
           assert.ok(await page.locator(".desk-east-details").isVisible());
           assert.equal(await page.locator('.desk-modes button[aria-selected="true"]').innerText(),"Work packages");
           await page.screenshot({path:join(evidence,"narayani-package-desktop.png")});
           report.screenshots.push("narayani-package-desktop.png");
           pass("Narayani package","Editable positions 4–15, 12 source activities, East context and shareable link");
           await page.locator('[data-compass-view="drawings"]').click();
           await page.locator(".desk-drawing-card[data-cad-verified]").first().waitFor({timeout:45000});
           const cards=page.locator(".desk-drawing-card[data-cad-verified]");
           assert.equal(await cards.count(),2);
           const values=await cards.evaluateAll(xs=>xs.map(x=>x.dataset.cadVerified));
           assert.ok(values.every(x=>x==="true"),"CAD public registers must pass live fetch, ID and schema validation: "+values);
           await cards.first().getByRole("button",{name:"Inspect in East"}).click();
           assert.match(await page.locator(".desk-compass-selected h2").innerText(),/engineering register/i);
           assert.match(await page.locator(".desk-compass-selected").innerText(),/HOLD_NOT_FOR_CONSTRUCTION/);
           pass("Narayani drawing source","Public CAD M34/owner status fetched with project ID guard, not IFC approval");
           await page.screenshot({path:join(evidence,"narayani-drawings-desktop.png")});
           report.screenshots.push("narayani-drawings-desktop.png");
           await desk("projects/fishtail/harisharan-residence/schedule-v002.html#activities");
           await page.locator('[data-compass-view="packages"]').click();
           await page.locator(".desk-package-form input").first().fill("70");
           await page.locator(".desk-package-form input").last().fill("90");
           await page.locator(".desk-package-apply").click();
           assert.equal(await page.locator(".desk-package-item").count(),21);
           pass("Harisharan package","70–90, 21 source activities and preserved 839-activity model");
           await page.locator('[data-compass-view="drawings"]').click();
           await page.locator(".desk-drawing-card[data-cad-verified]").first().waitFor({timeout:45000});
           const hcards=page.locator(".desk-drawing-card[data-cad-verified]");
           assert.equal(await hcards.count(),2);
           const hv=await hcards.evaluateAll(xs=>xs.map(x=>x.dataset.cadVerified));
           assert.ok(hv.every(x=>x==="true"),"Harisharan CAD register live fetch failed: "+hv);
           await hcards.first().getByRole("button",{name:"Inspect in East"}).click();
           assert.match(await page.locator(".desk-compass-selected h2").innerText(),/source-axis/i);
           await page.locator('[data-compass-view="calendar"]').click();
           const withCount=page.locator('.desk-day[data-count]:not([data-count="0"])');
           await withCount.first().click();
           assert.match(await page.locator(".desk-compass-selected h2").innerText(),/Calendar date/);
           assert.equal(await page.locator('.desk-modes button[aria-selected="true"]').innerText(),"Year calendar");
           pass("Harisharan CAD and calendar","Real CAD ID verified; year calendar updates East");
           const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
           for(const [path,name] of [
             ["projects/narayani/schedule-v002.html","narayani"],
             ["projects/fishtail/harisharan-residence/schedule-v002.html","harisharan"]
           ]){
             const mobileErrors=[];mobile.on("pageerror",e=>mobileErrors.push(e.message));
             await mobile.goto(root+path,{waitUntil:"domcontentloaded",timeout:45000});
             await mobile.locator(".desk-compass-selected h2").waitFor({timeout:30000});
             await mobile.locator('[data-compass-view="packages"]').click();
             assert.ok(await mobile.locator(".desk-package-form").isVisible());
             await mobile.locator('[data-compass-view="drawings"]').click();
             await mobile.locator(".desk-drawing-card[data-cad-verified]").first().waitFor({timeout:45000});
             assert.ok(await mobile.locator(".desk-compass-east").isVisible());
             await mobile.screenshot({path:join(evidence,name+"-mobile.png")});
             report.screenshots.push(name+"-mobile.png");
             assert.deepEqual(mobileErrors,[],"No runtime JS errors for "+name);
             pass(name+" mobile","390px responsive packages, drawing links and East panel");
           }
           assert.deepEqual(errors,[],"No page JS errors");
           pass("Live browser","All interactions executed against GitHub Pages with no runtime errors");
          }catch(e){
            report.error=String(e.stack||e);
            try{if(page)await page.screenshot({path:join(evidence,"failure.png")});}catch{}
            throw e;
          }finally{
            await writeFile(join(evidence,"report.json"),JSON.stringify(report,null,2));
            await browser?.close();
          }
          console.log("FOUR_VIEW_LIVE_QA_PASS",JSON.stringify(report));
          NODE
          cd "$RUNNER_TEMP/skyforge-four-view-qa"
          node qa.mjs
      - name: Preserve source/browser QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-four-view-live-20261117
          path: ${{ runner.temp }}/skyforge-four-view-qa/results
          retention-days: 30
          if-no-files-found: warn
