name: Milestone · Skyforge 2026-11-17 Four-View Work Packages & CAD
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-skyforge-four-views-20261117.yml
  workflow_dispatch:

# One-shot, immutable release of the pinned validated kernel (NOT the publisher main branch).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: 73a3d86a1bfb11d4cdedaa170980addfe2dfdeb0
      RELEASE_TAG: v1.18.0-skyforge-four-views.1
      RELEASE_NOTES: docs/milestones/SKYFORGE_V1_18_FOUR_VIEWS_20261117.md
    steps:
      - name: Check out exact validated kernel source
        uses: actions/checkout@v4
        with:
          ref: 73a3d86a1bfb11d4cdedaa170980addfe2dfdeb0
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact immutable source and source preservation policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -s "$RELEASE_NOTES"
          test -s tests/scheduling-four-views.test.mjs
          test -s src/presentation/scheduling-packages.mjs
          test -s src/presentation/scheduling-drawings.mjs
          test -s docs/audit/20261117-four-views/manifest.json
          test -s docs/audit/20261117-four-views/version-history.jsonl
          grep -Fq "four-view Scheduling Desk" "$RELEASE_NOTES"
          echo "Release content and owner-source governance pinned"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-run production engine tests at pinned release SHA
        run: |
          npm test
          npm run verify:calendar
          npm run machine:build
          npm run machine:verify
          npm run wbs:build
          npm run wbs:verify
          npm run pilot:build
          npm run pilot:verify
          npm run progress:build
          npm run progress:verify
          npm run visual:build
          npm run visual:verify
          npm run generic:build
          npm run generic:verify
          npm run site:build
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const read=p=>readFileSync(p,"utf8");
          const code=read("dist/src/presentation/scheduling-desk.mjs");
          const pkg=read("dist/src/presentation/scheduling-packages.mjs");
          const cad=read("dist/src/presentation/scheduling-drawings.mjs");
          const registry=JSON.parse(read("dist/work-items/scheduling-drawing-references.v1.json"));
          const meta=JSON.parse(read("docs/audit/20261117-four-views/manifest.json"));
          if(!code.includes('const modes=["activities","calendar","packages","drawings"]')||
           !code.includes('const details=put(east')||!pkg.includes("buildActivityPackage")||
           !cad.includes("verifyCADSource"))throw Error("Four views or shared East renderer absent");
          if(registry.project_links.length!==2||
            registry.project_links.some(x=>x.activity_links.length!==0)||
            meta.validation.live_browser_run!==44002313866||
            meta.validation.publisher_run!==44002155602)throw Error("Source identity or live QA evidence not pinned");
          console.log("FOUR VIEW RELEASE PASS: read-only 4-15,70-90 packages; CAD, East, source integrity");
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const component=read('dist/src/presentation/scheduling-compass.mjs');
          const desk=read('dist/src/presentation/scheduling-desk.mjs');
          const css=read('dist/assets/scheduling-desk.css');
          const shell=read('dist/assets/site-shell.mjs');
          const n=JSON.parse(read('dist/projects/narayani/schedule-v002.json'));
          const h=JSON.parse(read('dist/projects/fishtail/harisharan-residence/schedule-v002.json'));
          const m=JSON.parse(read('docs/audit/20261117-four-views/manifest.json'));
          for(const marker of ['WEST · PROJECT & WBS','EAST · ACTIONABLE CONTEXT','SOUTH · Continue / source history'])
            if(!component.includes(marker))throw Error('Missing compass region '+marker);
          if(!desk.includes('buildSchedulingCompass')||!css.includes('.desk-compass-grid'))
            throw Error('Shared Gantt source not connected to compass');
          if(!shell.includes('["Home","index.html"]'))throw Error('Primary nav stale');
          if(n.activities.length!==160||n.links.length!==210||n.holds.length!==6||
             h.activities.length!==839||h.links.length!==1321)
             throw Error('Project source model changed across UI-only milestone');
          if(m.qa?.browser_run!==43863288552||!m.qa?.publisher_passed||!m.qa?.kernel_passed)
             throw Error('Version governance has not been closed with successful QA');
          if(n.baseline_approved!==false||h.baseline_approved!==false)
             throw Error('Unapproved planning status incorrectly promoted');
          console.log('COMPASS RELEASE PACKAGE PASS: W/C/E/S, Home nav, preserved 160/839, QA manifest');
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root='dist/';
          const example=JSON.parse(readFileSync(root+'templates/scheduling/standard-schedule-input-v1.example.json'));
          const schema=JSON.parse(readFileSync(root+'schemas/standard-schedule-input.schema.json'));
          const comparison=JSON.parse(readFileSync(root+'templates/scheduling/edition-comparison.json'));
          if(example.format!=='SKYFORGE_STANDARD_SCHEDULE_INPUT_V1')throw Error('Input template not published');
          if(!schema.$schema||!schema.properties?.activities)throw Error('JSON Schema missing');
          if(comparison.format!=='SKYFORGE_STANDARD_SCHEDULE_COMPARISON_V1'||comparison.projects?.length!==2)
            throw Error('Both project views not normalized');
          if(comparison.projects[0].counts.activities!==160||comparison.projects[1].counts.activities!==839)
            throw Error('Unexpected project normalization');
          console.log('Release package verified: editable source template, schema, 160/839 comparison');
          NODE
      - name: Create verified annotated tag and published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m 'Skyforge 2026-11-17: source-governed 4-view Gantt/calendar/packages/CAD, verified live readback; no construction approval'
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing published milestone release found; validating"
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --title 'Skyforge v1.18 · Four-View Scheduling Desk and CAD Source Links' --notes-file "$RELEASE_NOTES" --latest=false
          fi
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = 'false'
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          echo 'Release tag, target SHA and published state verified'
